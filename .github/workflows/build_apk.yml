name: Build TDTech CPE Monitor APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.0'
          channel: 'stable'

      - name: Create project structure and build APK
        run: |
          mkdir temp_project
          cd temp_project
          flutter create --org com.tdtech --project-name tdtech_cpe_monitor --android-language kotlin .
          cp -f ../pubspec.yaml ./pubspec.yaml
          cp -f ../lib/main.dart ./lib/main.dart
          cp -f ../android/app/src/main/AndroidManifest.xml ./android/app/src/main/AndroidManifest.xml
          mkdir -p ./android/app/src/main/kotlin/com/tdtech/tdtech_cpe_monitor
          cp -f ../android/app/src/main/kotlin/com/tdtech/tdtech_cpe_monitor/MainActivity.kt ./android/app/src/main/kotlin/com/tdtech/tdtech_cpe_monitor/MainActivity.kt
          flutter pub get
          flutter build apk --release

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: TDTech-CPE-INS2-Monitor-APK
          path: temp_project/build/app/outputs/flutter-apk/app-release.apk
